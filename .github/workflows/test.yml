name: Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  LIBBPF_SHA: 85c0d575a447651bbeb8e2376eacd64c30dce9a6 # v1.8.0
  BPFTOOL_TAG: v7.7.0
  BPFTOOL_SHA256: 09150596f09356b0ff632dd7f9856e0ea86bf96b269e9bc94278d9a9432a268c

jobs:
  test:
    name: Build and run tests
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/toolchain
        with:
          libbpf-ref: ${{ env.LIBBPF_SHA }}

      - name: Check formatting
        run: |
          git ls-files '*.cpp' '*.hpp' '*.h' |
            xargs "$LLVM_BIN/clang-format" --style=file --dry-run --Werror

      - name: Check vmlinux.h
        run: scripts/check-vmlinux.sh "$CLANG" "$BPFTOOL" build/vmlinux-check

      - name: Build tests and examples
        run: |
          for d in tests examples/*/; do
            make -C "$d" -j"$(nproc)" \
              CLANG="$CLANG" BPFTOOL="$BPFTOOL" \
              LIBBPF_INC="$LIBBPF_INC" UAPI_INC="$LIBBPF_INC" \
              USER_CFLAGS="-isystem $LIBBPF_INC" \
              USER_LDLIBS="$LIBBPF_LIB -lelf -lz"
          done

      - name: Run tests
        run: |
          uname -r
          for t in tests/build/*_test; do
            echo "== $t"
            sudo "$t"
          done

      - name: Run examples
        run: |
          for d in examples/*/; do
            name=$(basename "$d")
            echo "== $name"
            sudo "$d/build/$name" 1
          done
