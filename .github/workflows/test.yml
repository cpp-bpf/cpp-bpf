name: Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # clang with llvm/llvm-project#233715 until it is in an LLVM release. The
  # branch bpf-btf-cxx-records on the fork keeps this commit reachable.
  LLVM_REPO: maxskokov/llvm-project
  LLVM_SHA: 5b41c481dec56b73f856713824f0a2de6836e0ed
  LIBBPF_SHA: 85c0d575a447651bbeb8e2376eacd64c30dce9a6 # v1.8.0
  BPFTOOL_TAG: v7.7.0
  BPFTOOL_SHA256: 09150596f09356b0ff632dd7f9856e0ea86bf96b269e9bc94278d9a9432a268c

jobs:
  test:
    name: Build and run tests
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build libelf-dev zlib1g-dev pkg-config linux-libc-dev

      - name: Restore clang
        id: llvm-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/llvm
          key: llvm-${{ runner.os }}-${{ env.LLVM_SHA }}-v2

      - name: Build clang
        if: steps.llvm-cache.outputs.cache-hit != 'true'
        run: |
          git init -q ~/llvm-src
          cd ~/llvm-src
          git fetch -q --depth 1 "https://github.com/$LLVM_REPO" "$LLVM_SHA"
          git checkout -q FETCH_HEAD
          cmake -S llvm -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DLLVM_ENABLE_PROJECTS=clang \
            -DLLVM_TARGETS_TO_BUILD=BPF \
            -DLLVM_ENABLE_ASSERTIONS=ON \
            -DLLVM_INCLUDE_TESTS=OFF \
            -DLLVM_INCLUDE_BENCHMARKS=OFF \
            -DLLVM_INCLUDE_EXAMPLES=OFF \
            -DCLANG_ENABLE_ARCMT=OFF \
            -DCLANG_ENABLE_STATIC_ANALYZER=OFF \
            -DCMAKE_INSTALL_PREFIX="$HOME/llvm"
          ninja -C build install-clang install-clang-resource-headers \
            install-clang-format

      # Saved right away, so that a later failure doesn't lose the build.
      - name: Save clang
        if: steps.llvm-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/llvm
          key: llvm-${{ runner.os }}-${{ env.LLVM_SHA }}-v2

      - name: Check formatting
        run: |
          git ls-files '*.cpp' '*.hpp' '*.h' |
            xargs "$HOME/llvm/bin/clang-format" --style=file --dry-run --Werror

      - name: Build libbpf
        run: |
          git init -q ~/libbpf
          git -C ~/libbpf fetch -q --depth 1 https://github.com/libbpf/libbpf "$LIBBPF_SHA"
          git -C ~/libbpf checkout -q FETCH_HEAD
          make -C ~/libbpf/src -j"$(nproc)" BUILD_STATIC_ONLY=1 \
            PREFIX="$HOME/libbpf-install" LIBDIR="$HOME/libbpf-install/lib" \
            install install_uapi_headers

      - name: Install bpftool
        run: |
          f="bpftool-$BPFTOOL_TAG-amd64.tar.gz"
          curl -sSfLO "https://github.com/libbpf/bpftool/releases/download/$BPFTOOL_TAG/$f"
          echo "$BPFTOOL_SHA256  $f" | sha256sum -c -
          tar -xzf "$f"
          chmod +x bpftool

      - name: Build tests and examples
        run: |
          inc="$HOME/libbpf-install/include"
          for d in tests examples/*/; do
            make -C "$d" -j"$(nproc)" \
              CLANG="$HOME/llvm/bin/clang" \
              BPFTOOL="$PWD/bpftool" \
              LIBBPF_INC="$inc" UAPI_INC="$inc" \
              USER_CFLAGS="-isystem $inc" \
              USER_LDLIBS="$HOME/libbpf-install/lib/libbpf.a -lelf -lz"
          done

      - name: Run tests
        run: |
          uname -r
          for t in tests/build/*_test; do
            echo "== $t"
            sudo "$t"
          done

      - name: Run examples
        run: |
          for d in examples/*/; do
            name=$(basename "$d")
            echo "== $name"
            sudo "$d/build/$name" 1
          done
